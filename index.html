<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Tulip Kite Beach - Wind & Tiden</title>
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Royal%20Tulip%20Kite%20Beach%22,%22short_name%22%3A%22Kite%20Royal%22,%22start_url%22%3A%22.%22,%22display%22%3A%22standalone%22,%22background_color%22%3A%22%230f172a%22,%22theme_color%22%3A%22%230284c7%22%7D">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --primary: #38bdf8;
            --success-bg: #064e3b;
            --success-border: #059669;
            --normal-bg: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 900px; margin: 0 auto; }
        header { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border); }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        h1 { font-size: 1.25rem; color: var(--text); }
        .settings-btn { background: var(--bg); border: 1px solid var(--border); padding: 6px 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border-radius: 6px; color: var(--text-muted); }
        .settings-btn.active { background: var(--primary); color: #0f172a; border-color: var(--primary); }
        
        .settings-panel { display: none; background: #0f172a; padding: 14px; border-radius: 8px; margin-top: 4px; border: 1px solid var(--border); gap: 12px; flex-direction: column; }
        .settings-panel.visible { display: flex; }
        
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        .weight-input-wrapper { display: flex; align-items: center; gap: 8px; }
        input[type="range"] { flex: 1; accent-color: var(--primary); }
        .weight-number { width: 55px; padding: 4px; font-size: 0.9rem; font-weight: bold; text-align: center; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
        select { padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 0.9rem; width: 100%; }
        .meta-info { font-size: 0.75rem; color: var(--primary); margin-top: 4px; line-height: 1.3; }

        .card { background: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border); margin-bottom: 16px; }
        .day-section { margin-bottom: 16px; }
        .day-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 8px; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .chart-icon-btn { background: transparent; border: none; font-size: 1.1rem; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
        .chart-icon-btn:hover { background: rgba(56, 189, 248, 0.1); }

        .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .slot-card { background: var(--normal-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; transition: all 0.2s; }
        .slot-card.rideable { background: var(--success-bg); border-color: var(--success-border); }
        .slot-time { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
        .slot-wind { font-size: 1.1rem; font-weight: 800; margin-bottom: 2px; }
        .slot-tide { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
        .chart-container { position: relative; height: 240px; width: 100%; }
        @media (max-width: 600px) { .slots-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>🪁 Royal Tulip Kite Beach</h1>
            <button class="settings-btn" id="btnSettings" onclick="toggleSettings()">⚙️ Settings</button>
        </div>

        <!-- Settings Panel (Modelle & Gewicht) -->
        <div class="settings-panel" id="settingsPanel">
            <div class="control-group">
                <label>Wettermodell wählen</label>
                <select id="modelSelect" onchange="renderApp()">
                    <option value="wrf9">WRF 9km (Thermik / Lokaler Standard)</option>
                    <option value="ecmwf">ECMWF 9km (Global)</option>
                    <option value="icon">ICON (DWD)</option>
                    <option value="gfs">GFS 13km (NOAA)</option>
                </select>
                <div class="meta-info" id="modelMeta">Letztes Update: Heute, 06:00 Uhr | Nächstes Update: ca. 12:30 Uhr</div>
            </div>

            <div class="control-group" style="margin-top: 4px;">
                <label>Kiter-Gewicht (mit Neo)</label>
                <div class="weight-input-wrapper">
                    <input type="range" id="weightRange" min="50" max="110" value="72" oninput="updateWeight(this.value)">
                    <input type="number" id="weightNumber" class="weight-number" min="40" max="130" value="72" oninput="updateWeight(this.value)">
                    <span style="font-size: 0.85rem; font-weight: 600;">kg</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Großer Chart jetzt OBERAN -->
    <div class="card" id="chartCard">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <label style="font-size: 0.85rem; color: var(--primary);">Wind & Gezeiten Verlauf</label>
            <select id="chartDaySelect" onchange="updateChart()" style="width: auto; padding: 4px 8px; font-size: 0.8rem;"></select>
        </div>
        <div class="chart-container">
            <canvas id="weatherChart"></canvas>
        </div>
    </div>

    <!-- Wind Cards / Tagesübersicht darunter -->
    <div id="mainContainer"></div>

<script>
    let userWeight = 72;
    let selectedDayIndex = 0;
    let myChart = null;
    
    const daysData = [];
    const today = new Date();
    for (let i = 0; i < 7; i++) {
        let d = new Date(today);
        d.setDate(today.getDate() + i);
        let dateString = d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
        
        let slots = [];
        let hours = [9, 11, 13, 15];
        hours.forEach((h, idx) => {
            let baseWind = 11 + Math.sin(i + h) * 4 + (h === 13 ? 3 : 0);
            let gusts = baseWind + 4;
            let tideHeight = 0.4 + Math.sin(i * 2 + idx * 0.5) * 0.3;
            let tideTrend = tideHeight > 0.4 ? "↑ Flut" : "↓ Ebbe";
            
            slots.push({
                hour: `${h}:00`,
                wrf9: { wind: Math.round(baseWind), gusts: Math.round(gusts) },
                ecmwf: { wind: Math.max(8, Math.round(baseWind - 2)), gusts: Math.max(10, Math.round(gusts - 2)) },
                icon: { wind: Math.max(9, Math.round(baseWind - 1)), gusts: Math.max(11, Math.round(gusts - 1)) },
                gfs: { wind: Math.max(7, Math.round(baseWind - 3)), gusts: Math.max(9, Math.round(gusts - 3)) },
                tide: tideHeight.toFixed(2) + "m",
                tideTrend: tideTrend
            });
        });
        daysData.push({ dateStr: dateString, slots: slots });
    }

    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        const btn = document.getElementById('btnSettings');
        panel.classList.toggle('visible');
        btn.classList.toggle('active');
    }

    function updateWeight(val) {
        userWeight = Math.max(40, Math.min(130, Number(val)));
        document.getElementById('weightRange').value = userWeight;
        document.getElementById('weightNumber').value = userWeight;
        renderApp();
    }

    function getMinWindFor14m() {
        if (userWeight <= 60) return 10;
        if (userWeight <= 75) return 11;
        if (userWeight <= 90) return 13;
        return 14;
    }

    function getActiveModelKey() {
        return document.getElementById('modelSelect').value;
    }

    function renderApp() {
        const container = document.getElementById('mainContainer');
        const modelKey = getActiveModelKey();
        const minWindNeeded = getMinWindFor14m();
        
        const metas = {
            wrf9: "Letztes Update: Heute, 06:00 Uhr | Nächstes Update: ca. 12:30 Uhr",
            ecmwf: "Letztes Update: Heute, 00:00 Uhr | Nächstes Update: ca. 12:00 Uhr",
            icon: "Letztes Update: Vor 45 Min. | Nächstes Update: ca. 11:15 Uhr",
            gfs: "Letztes Update: Heute, 00:00 Uhr | Nächstes Update: ca. 13:45 Uhr"
        };
        document.getElementById('modelMeta').innerText = metas[modelKey];

        const chartSelect = document.getElementById('chartDaySelect');
        chartSelect.innerHTML = '';
        daysData.forEach((day, idx) => {
            let opt = document.createElement('option');
            opt.value = idx;
            opt.innerText = day.dateStr;
            if (idx === selectedDayIndex) opt.selected = true;
            chartSelect.appendChild(opt);
        });

        let html = '';
        daysData.forEach((day, dIdx) => {
            html += `<div class="card day-section">
                <div class="day-title">
                    <span>📅 ${day.dateStr}</span>
                    <button class="chart-icon-btn" onclick="scrollToChart(${dIdx})" title="Im Chart anzeigen">📊</button>
                </div>
                <div class="slots-grid">`;
            
            day.slots.forEach(slot => {
                let wData = slot[modelKey];
                let isRideable = wData.wind >= minWindNeeded;
                html += `<div class="slot-card ${isRideable ? 'rideable' : ''}">
                    <div class="slot-time">${slot.hour}</div>
                    <div class="slot-wind">${wData.wind} <span style="font-size:0.7rem; font-weight:normal;">kn</span></div>
                    <div style="font-size:0.7rem; color:var(--text-muted);">Böen ${wData.gusts}</div>
                    <div class="slot-tide">${slot.tide} ${slot.tideTrend}</div>
                </div>`;
            });
            html += `</div></div>`;
        });
        container.innerHTML = html;
        updateChart();
    }

    function scrollToChart(dIdx) {
        selectedDayIndex = dIdx;
        updateChart();
        // Sanft nach oben zum Chart springen
        document.getElementById('chartCard').scrollIntoView({ behavior: 'smooth' });
    }

    function updateChart() {
        const chartDayIdx = document.getElementById('chartDaySelect').value;
        selectedDayIndex = Number(chartDayIdx);
        const day = daysData[selectedDayIndex];
        const modelKey = getActiveModelKey();
        const minWindNeeded = getMinWindFor14m();

        const labels = day.slots.map(s => s.hour);
        const windData = day.slots.map(s => s[modelKey].wind);
        const gustData = day.slots.map(s => s[modelKey].gusts);
        const tideData = day.slots.map(s => parseFloat(s.tide) * 20);

        const ctx = document.getElementById('weatherChart').getContext('2d');
        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Grundwind (kn)',
                        data: windData,
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.1)',
                        fill: true,
                        tension: 0.3,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Böen (kn)',
                        data: gustData,
                        borderColor: '#94a3b8',
                        borderDash: [4, 4],
                        tension: 0.3,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Gezeiten (cm)',
                        data: tideData,
                        borderColor: '#34d399',
                        tension: 0.3,
                        yAxisID: 'y1'
                    },
                    {
                        label: '14m² Limit',
                        data: Array(labels.length).fill(minWindNeeded),
                        borderColor: '#f87171',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        yAxisID: 'y'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: '#f8fafc', font: { size: 11 } } }
                },
                scales: {
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: { display: true, text: 'Wind in Knoten', color: '#94a3b8' },
                        min: 0,
                        max: 30,
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: { display: true, text: 'Wasserstand (cm)', color: '#94a3b8' },
                        min: 0,
                        max: 20,
                        grid: { drawOnChartArea: false },
                        ticks: { color: '#94a3b8' }
                    },
                    x: {
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    }
                }
            }
        });
    }

    renderApp();
</script>
</body>
</html>
